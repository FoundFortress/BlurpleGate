<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>BlurpleGate</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
</head>
<body>
<main class="container">
    <section>
        <h1>Enter Your Link Code Here</h1>
        <form action="/link/" method="GET">
            <label for="state">Link Code:</label>
            <input name="state" id="state" placeholder="000000" required autofocus maxlength="6" minlength="6" />
            <button type="submit">Submit</button>
        </form>
    </section>
</main>
<footer class="container">
    <small>Powered by <a href="https://plugins.foundfortress.net/blurplegate" target="_blank">BlurpleGate</a></small>
</footer>
</body>
</html>
